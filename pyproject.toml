[build-system]
requires = ["setuptools>=70,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "superarc"
version = "0.1.0"
description = "Reproducible pipeline for the figures and tables of the SuperARC paper"
requires-python = ">=3.13"

# Dependencies are pinned in requirements.txt and requirements.lock.txt, not
# here. This project reproduces published results, so the exact resolved
# versions matter more than a compatible range -- setuptools<81 in particular is
# load-bearing, because pybdm imports pkg_resources at module load.
dependencies = []

[tool.setuptools]
# The producers are top-level scripts with names like `30-1_...py` that are run,
# not imported. Only the package ships.
packages = ["superarc"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.ruff.lint.per-file-ignores]
# superarc/languages.py is assembled from exact line ranges of
# processing_answers.py and 24_PLOTS_paper.ipynb, so its bodies are
# character-for-character the ones that produced Supplementary Figures 2 to 4.
# Ruff's fixes for these rules would edit that code, and two of them would change
# what it does: `frame["col"] == True` is a pandas boolean mask, not a truth test,
# and rewriting it to `if frame["col"]` raises. The rest (unused `rects1`/`rects2`
# handles, `f""` without placeholders, `l` as a loop variable) are cosmetic and
# not worth diverging from the published source for.
#
# Declared here rather than as ~17 inline `noqa` comments so the verbatim bodies
# stay verbatim. This file is the sole owner of these figures -- there is no
# second copy that could drift by being exempted asymmetrically.
"superarc/languages.py" = ["E712", "E713", "E741", "F541", "F841"]

# superarc/evolution.py is assembled the same way, from exact line ranges of
# 35_summary_statistics.py, so its bodies are character-for-character the ones
# that produced Supplementary Figures 5 and 6. Two one-line `if ...: continue` /
# `if ...: return` statements. Cosmetic, and both inside plotting bodies whose
# every character is pinned by a pixel comparison against the published figure.
"superarc/evolution.py" = ["E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: runs a producer at full size. Deselect with -m 'not slow'.",
]
